<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Envío Universal - CHRFOTOGRAFÍA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800 p-4 md:p-8 font-sans">
    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-8">
        
        <!-- Panel Izquierdo: Configuración -->
        <div class="w-full lg:w-1/3 bg-white p-6 rounded-xl shadow-sm border border-stone-200 h-fit">
            <h1 class="text-2xl font-serif font-bold text-stone-900 mb-6">Configuración del Evento</h1>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-1">Nombre de los Novios</label>
                    <input type="text" id="input-novios" value="Alex & Estrella" class="w-full border border-stone-300 rounded-md p-2 text-sm focus:ring-stone-500 focus:border-stone-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-1">Enlace de la Galería</label>
                    <input type="text" id="input-link" value="https://chrfotografia.pixieset.com/alexandestrella/" class="w-full border border-stone-300 rounded-md p-2 text-sm focus:ring-stone-500 focus:border-stone-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-1">
                        Configuración de Firebase
                        <span class="text-xs text-stone-500 font-normal block">Pega el código tal como te lo da Firebase. (No importa el formato)</span>
                    </label>
                    <textarea id="input-config" rows="6" class="w-full border border-stone-300 rounded-md p-2 text-xs font-mono focus:ring-stone-500 focus:border-stone-500" placeholder="Pega aquí el const firebaseConfig = { ... }"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-1">Plantilla del Mensaje</label>
                    <textarea id="input-mensaje" rows="6" class="w-full border border-stone-300 rounded-md p-2 text-sm focus:ring-stone-500 focus:border-stone-500">¿Recuerdas lo increíble que la pasaste en la boda de {novios}? En el siguiente enlace podrás encontrar tus fotos y ver lo mucho que te divertiste con ellos:

{link}

Soy Chris, el fotógrafo de {novios}. 📸</textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-1">Nodo de la Base de Datos</label>
                    <input type="text" id="input-nodo" value="invitados" class="w-full border border-stone-300 rounded-md p-2 text-sm focus:ring-stone-500 focus:border-stone-500">
                </div>

                <!-- Caja de Alertas -->
                <div id="caja-error" class="hidden bg-red-50 border border-red-200 text-red-700 p-3 rounded-md text-sm font-medium">
                    <!-- Los errores de Firebase saldrán aquí -->
                </div>

                <button id="btn-conectar" class="w-full bg-stone-900 hover:bg-stone-800 text-white font-medium py-3 rounded-md transition shadow-sm">
                    Conectar y Cargar Tabla
                </button>
            </div>
        </div>

        <!-- Panel Derecho: Resultados -->
        <div class="w-full lg:w-2/3 bg-white shadow-sm rounded-xl border border-stone-200 flex flex-col h-[calc(100vh-4rem)]">
            <div class="p-4 border-b border-stone-200 bg-stone-50 flex justify-between items-center rounded-t-xl">
                <h2 class="font-bold text-stone-800">Lista de Invitados</h2>
                <div class="text-sm text-stone-500 font-medium" id="contador">0 de 0 enviados</div>
            </div>
            
            <div class="overflow-y-auto flex-1 p-0">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-stone-100 border-b border-stone-200 text-stone-700 text-xs uppercase tracking-wider sticky top-0">
                        <tr>
                            <th class="p-4">Invitado</th>
                            <th class="p-4">Teléfono</th>
                            <th class="p-4 text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-invitados" class="divide-y divide-stone-100 text-sm">
                        <tr>
                            <td colspan="3" class="p-10 text-center text-stone-400 flex flex-col items-center">
                                <svg class="w-12 h-12 mb-3 text-stone-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                                Llena los datos del panel izquierdo y haz clic en conectar.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp, getApps, deleteApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Función para extraer valores ignorando completamente el formato
        function extraerValor(texto, clave) {
            const regex = new RegExp(`${clave}\\s*:\\s*["']([^"']+)["']`);
            const match = texto.match(regex);
            return match ? match[1] : null;
        }

        document.getElementById('btn-conectar').addEventListener('click', async () => {
            const btn = document.getElementById('btn-conectar');
            const tabla = document.getElementById('tabla-invitados');
            const cajaError = document.getElementById('caja-error');
            
            // Ocultar errores previos
            cajaError.classList.add('hidden');
            
            const configText = document.getElementById('input-config').value;
            const nodo = document.getElementById('input-nodo').value.trim() || 'invitados';

            // Validar que pegaron algo
            if (!configText.includes('projectId')) {
                cajaError.innerHTML = "⚠️ No se detectó configuración de Firebase válida. Pega el código que te da la plataforma.";
                cajaError.classList.remove('hidden');
                return;
            }

            // Cambiar estado del botón
            btn.innerText = "Conectando y descargando...";
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');

            try {
                // Escáner de texto (Extrae los valores sin usar JSON.parse)
                const projectId = extraerValor(configText, 'projectId');
                const parsedConfig = {
                    apiKey: extraerValor(configText, 'apiKey'),
                    authDomain: extraerValor(configText, 'authDomain'),
                    projectId: projectId,
                    storageBucket: extraerValor(configText, 'storageBucket'),
                    messagingSenderId: extraerValor(configText, 'messagingSenderId'),
                    appId: extraerValor(configText, 'appId'),
                    databaseURL: extraerValor(configText, 'databaseURL') || `https://${projectId}-default-rtdb.firebaseio.com`
                };

                // Reiniciar apps de Firebase si ya había una conectada (útil si cambias de boda sin recargar)
                const apps = getApps();
                if (apps.length > 0) {
                    await deleteApp(apps[0]);
                }

                // Iniciar Firebase
                const app = initializeApp(parsedConfig);
                const db = getDatabase(app);
                const dbRef = ref(db, nodo);
                
                // Mostrar estado en la tabla
                tabla.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-stone-500 font-medium animate-pulse">Descargando datos desde Firebase...</td></tr>`;

                // Pedir datos (Aquí es donde se congelaba si fallaba)
                const snapshot = await get(dbRef);

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    tabla.innerHTML = '';
                    let total = 0;

                    const novios = document.getElementById('input-novios').value;
                    const link = document.getElementById('input-link').value;
                    const plantilla = document.getElementById('input-mensaje').value;

                    // Recuperar el registro local para saber a quién ya le mandaste
                    const storageKey = `enviados_${parsedConfig.projectId}`;
                    let enviados = JSON.parse(localStorage.getItem(storageKey) || '[]');

                    Object.keys(data).forEach(key => {
                        const invitado = data[key];
                        const nombre = invitado.nombre || invitado.name || "Invitado";
                        const telefono = invitado.telefono || invitado.phone || "";
                        
                        if (!telefono) return;
                        total++;

                        // Reemplazar variables en el mensaje
                        let textoMensaje = plantilla
                            .replace(/{novios}/g, novios)
                            .replace(/{link}/g, link);
                        
                        const urlWa = `https://wa.me/${telefono}?text=${encodeURIComponent(textoMensaje)}`;
                        
                        const yaEnviado = enviados.includes(telefono);
                        
                        const tr = document.createElement('tr');
                        tr.className = yaEnviado ? 'opacity-40 bg-stone-50' : 'hover:bg-stone-50';
                        tr.innerHTML = `
                            <td class="p-4 font-medium text-stone-900">${nombre}</td>
                            <td class="p-4 text-stone-500 font-mono text-xs">${telefono}</td>
                            <td class="p-4 text-center">
                                <a href="${urlWa}" target="_blank" data-phone="${telefono}" data-project="${parsedConfig.projectId}" onclick="marcarEnviado(this)" class="inline-block ${yaEnviado ? 'bg-emerald-600' : 'bg-stone-900 hover:bg-stone-800'} text-white text-xs font-medium px-4 py-2 rounded transition shadow-sm w-32">
                                    ${yaEnviado ? 'Enviado ✓' : 'Enviar WhatsApp'}
                                </a>
                            </td>
                        `;
                        tabla.appendChild(tr);
                    });

                    document.getElementById('contador').innerText = `${enviados.length} de ${total} enviados`;
                    
                    if (total === 0) {
                        tabla.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-stone-500">La base de datos se conectó, pero no se encontraron teléfonos en el nodo '${nodo}'.</td></tr>`;
                    }
                } else {
                    tabla.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-amber-600 font-medium">Conexión exitosa, pero el nodo '${nodo}' está vacío o no existe.</td></tr>`;
                }

            } catch (error) {
                console.error(error);
                let mensajeError = error.message;
                
                // Traducir error común de Firebase a lenguaje sencillo
                if (mensajeError.includes("permission_denied") || mensajeError.includes("Client doesn't have permission")) {
                    mensajeError = "🚨 PERMISO DENEGADO: Tu base de datos tiene las 'Reglas' en modo cerrado. Ve a la consola de Firebase > Realtime Database > Reglas y asegúrate de que `.read` esté en `true`.";
                }
                
                cajaError.innerHTML = `<strong>Error de Firebase:</strong><br>${mensajeError}`;
                cajaError.classList.remove('hidden');
                tabla.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-stone-500">Error en la conexión. Revisa la alerta en el panel izquierdo.</td></tr>`;
            } finally {
                // Restaurar botón
                btn.innerText = "Conectar y Cargar Tabla";
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        });

        // Función global para marcar enviados y guardarlos en memoria
        window.marcarEnviado = function(element) {
            const row = element.closest('tr');
            row.classList.add('opacity-40', 'bg-stone-50');
            
            element.innerText = 'Enviado ✓';
            element.classList.remove('bg-stone-900', 'hover:bg-stone-800');
            element.classList.add('bg-emerald-600');

            // Guardar en el navegador
            const phone = element.getAttribute('data-phone');
            const projectId = element.getAttribute('data-project');
            const storageKey = `enviados_${projectId}`;
            
            let enviados = JSON.parse(localStorage.getItem(storageKey) || '[]');
            if (!enviados.includes(phone)) {
                enviados.push(phone);
                localStorage.setItem(storageKey, JSON.stringify(enviados));
                
                // Actualizar contador visualmente
                const contadorTxt = document.getElementById('contador').innerText;
                const total = contadorTxt.split(' de ')[1];
                document.getElementById('contador').innerText = `${enviados.length} de ${total}`;
            }
        }
    </script>
</body>
</html>
